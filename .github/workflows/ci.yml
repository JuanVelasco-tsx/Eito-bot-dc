name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL de pruebas: con TEST_DATABASE_URL las pruebas con marker "db" corren aqui.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Compila todos los .py del repo (los modulos nuevos entran solos), sin los entornos virtuales.
      - name: Compilar
        run: python -m compileall -q -x '(^|\W)\.?venv\W' .

      # -rs muestra el motivo de cualquier prueba saltada (deberian ser 0).
      - name: Pruebas
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q -rs
