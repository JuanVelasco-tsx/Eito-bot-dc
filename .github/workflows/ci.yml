name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compilar
        run: python -m py_compile eito_setup_bot.py database.py

      # Las pruebas con marker "db" se saltan solas: no hay servicio de Postgres todavia.
      - name: Pruebas
        run: pytest -q
