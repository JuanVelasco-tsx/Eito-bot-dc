# =====================================================================
#  MENSAJES (los publica y mantiene el bot; las menciones no hacen ping)
#  Todos en #reglas, en este orden: info del estudio, reglas, guia, especialidades.
# =====================================================================
[[mensajes]]
key = "msg_info_estudio"
canal = "reglas"
titulo = "👻 Phantom Shadows Studios"
descripcion = """Somos un estudio de desarrollo centrado en **Roblox** y otros proyectos tecnológicos.

🔗 **GitHub:** https://github.com/Phantom-Shadows-Studios"""
color = "#5865F2"

[[mensajes]]
key = "msg_reglas"
canal = "reglas"
titulo = "📜 Reglas"
descripcion = """1️⃣ **Respeto ante todo.** Nada de insultos, acoso ni discriminación.
2️⃣ **Sin spam ni publicidad.** Nada de enlaces sospechosos ni invitaciones a otros servidores sin permiso del staff.
3️⃣ **No publiques código ni assets ajenos sin permiso** de su autor. Si algo no es tuyo, cita la fuente o no lo subas.
4️⃣ **Usa cada canal para su tema:** dudas en {canal:ayuda}, tus trabajos en {canal:showcase}, charla libre en {canal:general} y {canal:no_relacionado}.
5️⃣ **Respeta al staff.** Si no estás de acuerdo con una decisión, habla con ellos por privado.

⚖️ Incumplir las reglas puede acabar en aviso, silencio, expulsión o baneo."""
color = "#E74C3C"

[[mensajes]]
key = "msg_guia"
canal = "reglas"
titulo = "🧭 Guía para nuevos integrantes"
descripcion = """¡Bienvenido/a! Para empezar:

💬 Preséntate en {canal:general}.
🎨 Enseña lo que haces en {canal:showcase}.
💻 Programación en {canal:frontend} y {canal:backend}; Roblox en {canal:scripting_luau}.
🛠️ ¿Dudas? Pregunta en {canal:ayuda}.
🎭 Elige tus especialidades con los botones de abajo."""
color = "#2ECC71"

[[mensajes]]
key = "msg_especialidades"
canal = "reglas"
titulo = "🎭 Tus especialidades"
descripcion = "Pulsa un botón para darte o quitarte una especialidad."
color = "#9B59B6"
