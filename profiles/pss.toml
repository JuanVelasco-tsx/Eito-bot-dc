# =====================================================================
#  CATEGORIAS (orden: IMPORTANTE, JUEGO, COMUNIDAD, VOZ, EQUIPO, STAFF, TICKETS)
#  Solo EQUIPO y STAFF son privadas.
#  Las categorias antiguas "📢 Anuncios", "🟥 Roblox" y "🛠️ Soporte" (keys cat_anuncios,
#  cat_roblox, cat_soporte) ya no estan aqui: sus canales se mueven y el plan las lista como
#  "vacías, borrar a mano". El bot nunca las borra.
# =====================================================================
[[categorias]]
key = "cat_estudio"                # antes "📌 Estudio"; se reutiliza (se renombra) para IMPORTANTE
nombre = "📌 » IMPORTANTE"
orden = 1
overrides = [                      # visible para todos, solo lectura para @everyone
  { objetivo = "@everyone", denegar = ["send_messages", "create_public_threads", "send_messages_in_threads"] },
  { objetivo = "developer", permitir = ["send_messages"] },
  { objetivo = "administrador", permitir = ["send_messages"] },
]

# El juego: publica. `{juego}` se sustituye por el nombre del juego en mayusculas ("EL JUEGO" si esta vacio).
[[categorias]]
key = "cat_juego"
nombre = "🎮 » {juego}"
orden = 2

[[categorias]]
key = "cat_comunidad"
nombre = "💬 » COMUNIDAD"
orden = 3

# La categoria "💻 » DESARROLLO" (key cat_desarrollo) ya no esta aqui: sus canales se mueven a JUEGO y
# EQUIPO y el plan la lista como vacia ("borrar a mano"). El bot nunca la borra.

# Plantilla (orden 4): una categoria por juego. Ver mas abajo, junto a los canales.
# Plantilla (orden 5): "🗄️ » ARCHIVO", solo lectura para todos. Ver mas abajo.

[[categorias]]
key = "cat_voz"
nombre = "🔊 » VOZ"
orden = 6

[[categorias]]
key = "cat_equipo"
nombre = "🔒 » EQUIPO"
orden = 7
overrides = [                      # privada: el bot se añade solo un override propio
  { objetivo = "@everyone", denegar = ["view_channel"] },
  { objetivo = "developer", permitir = ["view_channel"] },
  { objetivo = "colaborador", permitir = ["view_channel"] },
  { objetivo = "administrador", permitir = ["view_channel"] },
]

[[categorias]]
key = "cat_staff"
nombre = "🛡️ » STAFF"
orden = 8
overrides = [
  { objetivo = "@everyone", denegar = ["view_channel"] },
  { objetivo = "propietario", permitir = ["view_channel"] },
  { objetivo = "administrador", permitir = ["view_channel"] },
]

# Aqui el bot crea un canal por ticket abierto (privado: lo ven quien lo abre y el staff).
[[categorias]]
key = "cat_tickets"
nombre = "🎫 » TICKETS"
orden = 9
overrides = [
  { objetivo = "@everyone", denegar = ["view_channel"] },
  { objetivo = "propietario", permitir = ["view_channel"] },
  { objetivo = "administrador", permitir = ["view_channel"] },
]

