nombre = "💬・general"
nombre_actual = "general"
adoptar = true
categoria = "cat_comunidad"
mover = true
orden = 1

# Antes "📸・showcase": se renombra el mismo canal (la key no cambia para no perder el mapeo).
[[canales]]
key = "showcase"
nombre = "📸・capturas"
categoria = "cat_comunidad"
tema = "Comparte capturas y clips del juego."
orden = 2

[[canales]]
key = "comandos"
nombre = "🤖・comandos"
categoria = "cat_comunidad"
tema = "Aquí se usan los comandos del bot."
orden = 3

# El nombre EXACTO "📈・niveles" es el de EITO; ademas se mapea en [recursos.canales]. Solo lectura:
# escribe el bot (avisos de nivel).
[[canales]]
key = "niveles"
nombre = "📈・niveles"
categoria = "cat_comunidad"
tema = "Avisos de subida de nivel. Mira el tuyo con !nivel y el ranking con !top."
overrides = [
  { objetivo = "@everyone", denegar = ["send_messages", "create_public_threads", "send_messages_in_threads"] },
]
orden = 4

[[canales]]
key = "no_relacionado"
nombre = "🎲・no-relacionado"
nombre_actual = "no-relacionado"
adoptar = true
categoria = "cat_comunidad"
mover = true
orden = 5

# --- 🔊 » VOZ (publica) ---
[[canales]]
