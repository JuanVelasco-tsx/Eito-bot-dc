# Perfil temporal de Phantom Shadows Studios (PSS) para el bot Eito.
# Se activa con PSS_PROFILE_ENABLED=1. Guia completa: docs/phantom-shadows-studios.md
#
# PSS es un servidor PUBLICO para la comunidad: solo "🔒 » EQUIPO" y "🛡️ » STAFF" son privados.
# Formato de nombres: categorias "emoji » NOMBRE", canales "emoji・nombre".
#
# Reglas de este archivo:
#   - Cada recurso tiene una `key` estable (a-z, 0-9, _) que NO debe cambiar: es la clave del
#     mapeo key -> ID de Discord en la tabla perfil_recursos. Si renombras algo que ya esta
#     mapeado (lo creo yo), se EDITA el mismo recurso: no se crea un duplicado.
#   - Nada se borra jamas (canales, categorias, roles). Un recurso que ya existia y no creo el
#     bot solo se toca si lo marcas aqui (`adoptar`, `mover`, `sincronizar_permisos`).
#     Unica excepcion: al mover un mensaje del bot a otro canal se republica y se borra el
#     antiguo, solo si es del bot y esta mapeado.
#   - Estructura pequeña a proposito (15 canales de texto/anuncios/foros y 2 de voz). Lo demas
#     esta COMENTADO como plantilla: descomentalo cuando haga falta.
#   - Los canales de anuncios ("news") y los foros ("forum") exigen la funcion COMUNIDAD:
#     activala antes de `!pss aplicar` (si no, el plan los marca "bloqueado: activa Comunidad").
#   - Orden: el de `orden` en las categorias y, dentro de cada una, el de `orden` en los canales.
#   - Tras editar: `!pss recargar` (en Railway, el archivo cambia con un deploy) y `!pss plan`.

[perfil]
nombre = "Phantom Shadows Studios"
guild_id = 1420403964746268684
owner_id = 668148837579227137      # solo verificacion; el dueño real es el del servidor
gestores = []                      # keys de roles que pueden usar !pss ademas del dueño

[eventos]
xp = false                         # sin XP por mensajes ni subidas de nivel
voz = false                        # sin XP ni contadores por voz
anti_multicuentas = true           # servidor publico: se aplica el filtro de cuentas nuevas de EITO
rol_al_entrar = "miembro"          # key del rol que se da al entrar
bienvenida = "general"             # key del canal de bienvenida ("" = ninguno)
canal_logs = "registros"           # key del canal de logs de moderacion (!kick, !ban, anti-multicuentas...)

[comandos]
# Comandos de EITO que crearian o publicarian estructura de EITO: no funcionan en PSS.
bloquear = [
  "setup", "setupsteam", "setuprecompensas", "crearvcs", "panelcochipuerco",
  "panelroles", "reglas", "info", "presentaciones", "paneltickets",
]

# =====================================================================
#  ROLES (de arriba abajo)
# =====================================================================
[[roles]]
key = "propietario"
nombre = "Propietario"
color = "#F1C40F"
hoist = true
# Se arrastra a mano POR ENCIMA del rol del bot: el plan no avisa de la jerarquia para este rol.
por_encima_del_bot = true
permisos = []                      # sin administrator: solo color y separacion en la lista
# Los roles nuevos se crean por debajo del bot: arrastra este a mano por encima del bot.

[[roles]]
key = "administrador"
nombre = "Administrador"
color = "#E74C3C"
hoist = true
permisos = [
  "view_channel", "send_messages", "read_message_history", "embed_links", "attach_files",
  "add_reactions", "manage_channels", "manage_roles", "manage_messages", "manage_guild",
  "view_audit_log", "kick_members", "ban_members", "moderate_members", "mention_everyone",
]

[[roles]]
key = "developer"
nombre = "Developer"
existing_id = 1561497283315638312
# Se reutiliza tal cual. NO pongas adoptar = true: el bot le quitaria administrator.
# RIESGO: mientras tenga administrator, quien lo reciba ignora todos los overrides.
# Quitaselo a mano (ver "Pasos manuales en Discord" en la guia).

[[roles]]
key = "colaborador"
nombre = "Colaborador"
color = "#3498DB"
hoist = true
permisos = ["view_channel", "send_messages", "read_message_history", "embed_links", "attach_files", "add_reactions"]

[[roles]]
key = "miembro"
nombre = "Miembro"
color = "#2ECC71"
permisos = ["view_channel", "send_messages", "read_message_history", "embed_links", "attach_files", "add_reactions"]

# Especialidades autoasignables con botones (sin permisos).
[[roles]]
key = "scripter"
nombre = "Scripter"
color = "#9B59B6"
mentionable = true
autoasignable = true

[[roles]]
key = "builder"
nombre = "Builder"
color = "#E67E22"
mentionable = true
autoasignable = true

[[roles]]
key = "ui"
nombre = "UI"
color = "#1ABC9C"
mentionable = true
autoasignable = true

# =====================================================================
#  CATEGORIAS (orden: IMPORTANTE, COMUNIDAD, DESARROLLO, VOZ, EQUIPO, STAFF)
#  Solo EQUIPO y STAFF son privadas.
#  Las categorias antiguas "📢 Anuncios", "🟥 Roblox" y "🛠️ Soporte" (keys cat_anuncios,
#  cat_roblox, cat_soporte) ya no estan aqui: sus canales se mueven y el plan las lista como
#  "vacías, borrar a mano". El bot nunca las borra.
# =====================================================================
[[categorias]]
key = "cat_estudio"                # antes "📌 Estudio"; se reutiliza (se renombra) para IMPORTANTE
nombre = "📌 » IMPORTANTE"
orden = 1
overrides = [                      # visible para todos, solo lectura para @everyone
  { objetivo = "@everyone", denegar = ["send_messages", "create_public_threads", "send_messages_in_threads"] },
  { objetivo = "developer", permitir = ["send_messages"] },
  { objetivo = "administrador", permitir = ["send_messages"] },
]

[[categorias]]
key = "cat_comunidad"
nombre = "💬 » COMUNIDAD"
orden = 2

[[categorias]]
key = "cat_desarrollo"
nombre = "💻 » DESARROLLO"
orden = 3                          # publica

# Plantilla (orden 4): una categoria por juego. Ver mas abajo, junto a los canales.
# Plantilla (orden 5): "🗄️ » ARCHIVO", solo lectura para todos. Ver mas abajo.

[[categorias]]
key = "cat_voz"
nombre = "🔊 » VOZ"
orden = 6

[[categorias]]
key = "cat_equipo"
nombre = "🔒 » EQUIPO"
orden = 7
overrides = [                      # privada: el bot se añade solo un override propio
  { objetivo = "@everyone", denegar = ["view_channel"] },
  { objetivo = "developer", permitir = ["view_channel"] },
  { objetivo = "colaborador", permitir = ["view_channel"] },
  { objetivo = "administrador", permitir = ["view_channel"] },
]

[[categorias]]
key = "cat_staff"
nombre = "🛡️ » STAFF"
orden = 8
overrides = [
  { objetivo = "@everyone", denegar = ["view_channel"] },
  { objetivo = "propietario", permitir = ["view_channel"] },
  { objetivo = "administrador", permitir = ["view_channel"] },
]

