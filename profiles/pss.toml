# =====================================================================
#  MENSAJES (los publica y mantiene el bot; las menciones no hacen ping)
#  #reglas: solo las reglas. #info-estudio: info del estudio, guia para jugadores y panel de roles.
#  Si cambias el canal de un mensaje ya publicado, se publica en el nuevo y se BORRA el
#  antiguo (solo si es del bot y esta mapeado).
# =====================================================================
[[mensajes]]
key = "msg_reglas"
canal = "reglas"
titulo = "📜 Reglas"
descripcion = """1️⃣ **Respeto ante todo.** Nada de insultos, acoso ni discriminación.
2️⃣ **Sin spam ni publicidad.** Nada de enlaces sospechosos ni invitaciones a otros servidores sin permiso del staff.
3️⃣ **Respeta lo que crean otros:** no publiques capturas, arte o creaciones ajenas como si fueran tuyas.
4️⃣ **Usa cada canal para su tema:** dudas en {canal:ayuda}, tus capturas en {canal:showcase}, ideas en {canal:sugerencias}, comandos del bot en {canal:comandos}, charla libre en {canal:general} y {canal:no_relacionado}.
5️⃣ **Respeta al staff.** Si no estás de acuerdo con una decisión, habla con ellos por privado.
6️⃣ **No uses ni compartas exploits o hacks.** Si encuentras un bug, repórtalo en {canal:reportar_bugs}; no lo abuses.

⚖️ Incumplir las reglas puede acabar en aviso, silencio, expulsión o baneo."""
color = "#E74C3C"

[[mensajes]]
