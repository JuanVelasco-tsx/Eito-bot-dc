# Perfil temporal de Phantom Shadows Studios (PSS) para el bot Eito.
# Se activa con PSS_PROFILE_ENABLED=1. Guia completa: docs/phantom-shadows-studios.md
#
# PSS es un servidor PUBLICO para la comunidad: solo "🔒 » EQUIPO" y "🛡️ » STAFF" son privados.
# Formato de nombres: categorias "emoji » NOMBRE", canales "emoji・nombre".
#
# Reglas de este archivo:
#   - Cada recurso tiene una `key` estable (a-z, 0-9, _) que NO debe cambiar: es la clave del
#     mapeo key -> ID de Discord en la tabla perfil_recursos. Si renombras algo que ya esta
#     mapeado (lo creo yo), se EDITA el mismo recurso: no se crea un duplicado.
#   - Nada se borra jamas (canales, categorias, roles). Un recurso que ya existia y no creo el
#     bot solo se toca si lo marcas aqui (`adoptar`, `mover`, `sincronizar_permisos`).
#     Unica excepcion: al mover un mensaje del bot a otro canal se republica y se borra el
#     antiguo, solo si es del bot y esta mapeado.
#   - Estructura pequeña a proposito (20 canales de texto/anuncios/foros y 2 de voz). Lo demas
#     esta COMENTADO como plantilla: descomentalo cuando haga falta.
#   - Los canales de anuncios ("news") y los foros ("forum") exigen la funcion COMUNIDAD:
#     activala antes de `!pss aplicar` (si no, el plan los marca "bloqueado: activa Comunidad").
#   - Orden: el de `orden` en las categorias y, dentro de cada una, el de `orden` en los canales.
#   - Tras editar: `!pss recargar` (en Railway, el archivo cambia con un deploy) y `!pss plan`.

# Datos del juego de Roblox (la comunidad son sus JUGADORES). Todo es opcional:
#  - `nombre` vacio: la categoria se llama "🎮 » EL JUEGO" y la info omite el campo del juego.
#    Al rellenarlo, `!pss aplicar` renombra la categoria a "🎮 » <NOMBRE>" y actualiza los mensajes.
#  - `enlace_juego` y `enlace_grupo`: URLs https de roblox.com (se validan).
[juego]
nombre = ""
enlace_juego = ""        # p. ej. "https://www.roblox.com/games/123456789/Nombre"
enlace_grupo = ""        # p. ej. "https://www.roblox.com/communities/123456789/Nombre"

[perfil]
nombre = "Phantom Shadows Studios"
guild_id = 1420403964746268684
owner_id = 668148837579227137      # solo verificacion; el dueño real es el del servidor
gestores = []                      # keys de roles que pueden usar !pss ademas del dueño

[eventos]
xp = true                          # XP por mensajes, niveles y !nivel / !top (avisos en 📈・niveles)
voz = true                         # XP y contadores por voz (🎧 Voz activa a las 50 h, tope 6 h al dia, como en EITO)
fundador_automatico = true         # quien entra recibe 🌱 Fundador mientras haya menos de 100 (ver !fundadores)
anti_multicuentas = true           # servidor publico: se aplica el filtro de cuentas nuevas de EITO
rol_al_entrar = "miembro"          # key del rol que se da al entrar
bienvenida = "bienvenida"          # key del canal de bienvenida ("" = ninguno); texto en [bienvenida]
canal_logs = "registros"           # key del canal de logs de moderacion (!kick, !ban, anti-multicuentas...)

# Mensaje de bienvenida (embed en el canal `bienvenida`). Admite {usuario}, {servidor}, {numero}
# (miembros del servidor), {canal:key} y {rol:key}.
[bienvenida]
titulo = "👋 ¡Bienvenido/a a {servidor}!"
descripcion = """¡Hola {usuario}! 🎉

📜 Lee las reglas en {canal:reglas}.
ℹ️ Conoce el estudio y elige tus roles en {canal:info_estudio}.

Eres el miembro **#{numero}** 🎊"""
color = "#2ECC71"

[comandos]
# Comandos de EITO que crearian o publicarian estructura de EITO: no funcionan en PSS.
bloquear = [
  "setup", "setupsteam", "setuprecompensas", "crearvcs", "panelcochipuerco",
  "panelroles", "reglas", "info", "presentaciones",
  # Del bot de la comunidad de EITO (perfiles de Steam, partidas, tarjeta de perfil): no aplican en PSS.
  "steam", "jugar", "perfil",
  # importarniveles: nunca (lee avisos de niveles de EITO). darnivel: herramienta de pruebas,
  # no debe existir en un servidor real.
  "importarniveles", "darnivel",
]
# Quien los use aqui ve "Este comando no está disponible en este servidor."

# Rangos por antiguedad (Veterano a los 90 dias y Leyenda a los 180, como en EITO). En PSS los dias
# cuentan desde la mas tardia entre la fecha de entrada y `contar_desde` (UTC): asi nadie sube de
# golpe por haber entrado antes de que existieran los rangos. Sin la clave, cuenta la entrada.
[rangos]
contar_desde = "2026-10-19"

# =====================================================================
#  AYUDA de este servidor (!ayuda). Cada comando debe existir en el bot y NO estar en
#  `bloquear`. Solo se muestra lo que quien pregunta puede ejecutar (can_run), como en EITO;
#  `solo_moderadores = true` oculta ademas la linea a quien no puede expulsar ni aislar
#  (para comandos como !warns, que cualquiera puede usar para ver los suyos).
#  El texto admite {canal:key} y {rol:key}.
# =====================================================================
[ayuda]
titulo = "📖 Comandos de Phantom Shadows Studios"
descripcion = "Todos los comandos usan el prefijo `!`"
pie = "Cada uno ve solo los comandos que puede usar."

[[ayuda.secciones]]
titulo = "🎮 Comunidad"
comandos = [
  { comando = "ping", texto = "comprueba que el bot responde" },
  { comando = "avatar", uso = "!avatar [@usuario]", texto = "muestra un avatar en grande" },
  { comando = "serverinfo", texto = "info del servidor" },
  { comando = "miembros", texto = "cuántos miembros hay" },
  { comando = "nivel", uso = "!nivel [@usuario]", texto = "muestra tu nivel y XP" },
  { comando = "top", texto = "ranking de niveles del servidor" },
]

[[ayuda.secciones]]
titulo = "📊 Utilidad"
comandos = [
  { comando = "encuesta", uso = "!encuesta <pregunta>", texto = "crea una encuesta 👍👎" },
  { comando = "sugerencia", uso = "!sugerencia <texto>", texto = "envía una sugerencia con votación; se publica en {canal:sugerencias}" },
]

[[ayuda.secciones]]
titulo = "🛡️ Moderación"
comandos = [
  { comando = "borrar", uso = "!borrar <n>", texto = "borra los últimos N mensajes (1–100)" },
  { comando = "kick", uso = "!kick @usuario [razón]", texto = "expulsa a un miembro" },
  { comando = "ban", uso = "!ban @usuario [razón]", texto = "banea a un miembro" },
  { comando = "mute", uso = "!mute @usuario <duración> [razón]", texto = "silencia (ej. 10m, 2h)" },
  { comando = "unmute", uso = "!unmute @usuario", texto = "quita el silencio" },
  { comando = "warn", uso = "!warn @usuario [razón]", texto = "avisa a un miembro" },
  { comando = "warns", uso = "!warns [@usuario]", texto = "muestra los avisos", solo_moderadores = true },
  { comando = "permitir", uso = "!permitir <ID>", texto = "deja entrar a una cuenta nueva legítima (anti-multicuentas)" },
  { comando = "despermitir", uso = "!despermitir <ID>", texto = "quita esa excepción" },
]

[[ayuda.secciones]]
titulo = "⚙️ Administración"
comandos = [
  { comando = "anuncio", uso = "!anuncio [everyone|here] <texto>", texto = "publica un anuncio en {canal:anuncios} (con ping si pones everyone o here)" },
  { comando = "exportarserver", texto = "exporta roles y canales a JSON por mensaje privado" },
  { comando = "setxp", uso = "!setxp @usuario <xp>", texto = "fija la XP total de alguien" },
  { comando = "resetxp", uso = "!resetxp @usuario", texto = "pone en 0 la XP total de alguien" },
  { comando = "fundadores", uso = "!fundadores [confirmar]", texto = "da el rol 🌱 Fundador a los 100 primeros miembros (una sola vez; sin `confirmar` es solo una vista previa)" },
]

# =====================================================================
#  RECURSOS de los sistemas de EITO (xp, tickets, rangos, !anuncio...)
#  Esos sistemas buscan sus roles y canales por ID o nombre fijos de EITO; aqui se les dice cuales
#  son los de PSS: clave del sistema = key de [[roles]] / [[canales]] / [[categorias]].
#  Lo que NO este aqui no existe en PSS (nunca se usan los IDs de EITO), asi que cada sistema se
#  activa añadiendo sus claves. Claves validas: ver RECURSOS_* en profiles/pss_config.py.
# =====================================================================
[recursos.roles]
activo_mes = "activo_mes"          # top 3 de XP del mes anterior
fundador = "fundador"              # !fundadores y el fundador que vuelve
veterano = "veterano"              # rangos por antiguedad (solo tiempo)
leyenda = "leyenda"
og = "og"                          # honor: lo da el staff a mano
voz_activa = "voz_activa"          # 50 h en voz (3000 min), con tope de 6 h al dia
honor = ["og"]                     # roles de honor: al darlos a mano se anuncia el logro
excluidos_activo_mes = ["developer"]   # no ganan el Activo del mes (el dueño y los bots, siempre)
staff_tickets = ["propietario", "administrador"]   # ven y cierran los tickets
ping_tickets = ["propietario", "administrador"]    # se mencionan al abrir un ticket
# `developer` sin mapear a proposito: !exportarserver, !setxp, !resetxp y !fundadores son solo del dueño.
# Sin `logros`: los logros se anuncian en 📈・niveles (el respaldo de EITO).

[recursos.canales]
anuncios = "anuncios"              # !anuncio publica aqui
niveles = "niveles"                # avisos de nivel, logros y Activo del mes
soporte = "soporte"                # donde !paneltickets publica el panel
transcripciones = "tickets_log"    # transcripcion de cada ticket al cerrarlo

# Webhook de releases: POST /release-webhook con {"destino": "pss", "version": ..., "changelog": ...}
# publica aqui y menciona al rol. Sin "destino" el aviso va a donde siempre (EITO).
[webhook.pss]
canal = "anuncios"
rol = "novedades"

[recursos.categorias]
tickets = "cat_tickets"            # donde se crean los canales de ticket

