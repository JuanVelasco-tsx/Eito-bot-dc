[[canales]]
key = "comandos"
nombre = "🤖・comandos"
categoria = "cat_comunidad"
tema = "Aquí se usan los comandos del bot."
orden = 4

[[canales]]
key = "no_relacionado"
nombre = "🎲・no-relacionado"
nombre_actual = "no-relacionado"
adoptar = true
categoria = "cat_comunidad"
mover = true
orden = 5

# --- 💻 » DESARROLLO (publica) ---
# Antes en "🟥 Roblox" (creado por el bot): se renombra y se mueve.
