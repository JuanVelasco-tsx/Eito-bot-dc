# =====================================================================
#  CANALES (15 de texto/anuncios/foros + 2 de voz)
# =====================================================================
# --- 📌 » IMPORTANTE (solo lectura) ---
[[canales]]
key = "reglas"
nombre = "📜・reglas"
categoria = "cat_estudio"
tema = "Las reglas del servidor."
orden = 1

# Era un canal de texto creado por el bot: se convierte en canal de ANUNCIOS (news) y se mueve
# aqui. Requiere Comunidad; sin ella el plan lo marca "bloqueado: activa Comunidad".
[[canales]]
key = "anuncios"
nombre = "📣・anuncios"
tipo = "news"
categoria = "cat_estudio"
tema = "Novedades y avisos oficiales del estudio."
mover = true
sincronizar_permisos = true
orden = 2

[[canales]]
key = "info_estudio"
nombre = "ℹ️・info-estudio"
categoria = "cat_estudio"
tema = "Quiénes somos, guía para empezar y especialidades."
orden = 3

# --- 💬 » COMUNIDAD ---
# Existentes (no los creo yo): se adoptan SOLO para renombrarlos (`nombre_actual` = como se
# llaman hoy) y se mueven. No se sincronizan: conservan sus permisos (los de todos).
[[canales]]
key = "general"
nombre = "💬・general"
nombre_actual = "general"
adoptar = true
categoria = "cat_comunidad"
mover = true
orden = 1

[[canales]]
key = "showcase"
nombre = "📸・showcase"
categoria = "cat_comunidad"
tema = "Enseña lo que estás haciendo: capturas, clips y proyectos propios."
orden = 2

# El nombre EXACTO "💡・sugerencias" es el que busca !sugerencia de EITO para publicar ahí.
[[canales]]
key = "sugerencias"
nombre = "💡・sugerencias"
categoria = "cat_comunidad"
tema = "Ideas para el servidor y para el estudio. Usa !sugerencia <texto>."
